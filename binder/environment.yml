# a mybinder.org-ready environment for demoing chaldene
# this environment may also be used locally on Linux/MacOS/Windows, e.g.
#
#   conda env update --file binder/environment.yml
#   conda activate chaldene-demo
#
name: chaldene-demo

channels:
  - conda-forge

dependencies:
  # runtime dependencies
  - python >=3.10,<3.11.0a0
  - jupyterlab >=4.0.0,<5
  # labextension build dependencies
  # @jupyterlab/builder 4.5+ requires Node.js ^20.19.0 || >=22.12.0
  - nodejs >=22.12,<23
  - openjdk=11
  - pyimagej
  - pip
  - wheel
  - pip:
      - numpy
      - pillow
      - pandas
      - scikit-image
      - scipy
      - comm
      - opencv-python-headless
      - matplotlib
      - chaldene-super-resolution
      - im2im
  # additional packages for demos
  # - ipywidgets
